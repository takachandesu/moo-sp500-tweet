# GitHubは60日間コミットが無いとスケジュール実行を自動停止する。
# 月2回小さなファイルを更新して停止を防ぐ (2026/10/11 追加)
name: Keepalive

on:
  schedule:
    - cron: "17 3 1,15 * *"   # 毎月1日・15日 12:17 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: keepalive commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
